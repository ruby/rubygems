name: realworld

on:
  pull_request:

  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  bundler:
    name: Realworld Bundler on ${{ matrix.os.name }} (${{ matrix.ruby.name }})
    runs-on: ${{ matrix.os.value }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: Ubuntu, value: ubuntu-24.04 }

        ruby:
          - { name: ruby-3.2, value: 3.2.11 }
          - { name: ruby-3.3, value: 3.3.11 }
          - { name: ruby-3.4, value: 3.4.9 }
          - { name: ruby-4.0, value: 4.0.5 }

        include:
          - { os: { name: macOS, value: macos-26 }, ruby: { name: ruby-3.2, value: 3.2.11 } }
          - { os: { name: macOS, value: macos-26 }, ruby: { name: ruby-3.3, value: 3.3.11 } }
          - { os: { name: macOS, value: macos-26 }, ruby: { name: ruby-3.4, value: 3.4.9 } }
          - { os: { name: macOS, value: macos-26 }, ruby: { name: ruby-4.0, value: 4.0.5 } }
    env:
      RGV: .
      RUBYOPT: --disable-gems
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby.value }}
          bundler: none
      - name: Prepare dependencies
        run: bin/rake dev:deps
      - name: Run Test
        run: bin/rake spec:realworld
      - name: Upload used cassettes as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassettes-bundler-${{ matrix.os.value }}-${{ matrix.ruby.name }}
          path: ./spec/support/artifice/used_cassettes.txt
    timeout-minutes: 20

  tapioca:
    name: Tapioca
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4.9
          bundler: none
      - name: Prepare tapioca
        run: ../../../../bin/bundle install
        working-directory: spec/realworld/fixtures/tapioca
      - name: Run tapioca
        run: ../../../../bin/bundle exec tapioca init
        working-directory: spec/realworld/fixtures/tapioca
    timeout-minutes: 20

  system_rubygems_bundler:
    name: Realworld Bundler against system Rubygems (${{ matrix.ruby.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: { name: ruby-3.2, value: 3.2.11 } }
          - { ruby: { name: ruby-3.3, value: 3.3.11 } }
          - { ruby: { name: ruby-3.4, value: 3.4.9 } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby.value }}
          bundler: none
      - name: Prepare dependencies
        run: bin/rake dev:deps
      - name: Run Test
        run: bin/rake spec:realworld
      - name: Upload used cassettes as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassettes-system-rubygems-bundler-${{ matrix.ruby.name }}
          path: ./spec/support/artifice/used_cassettes.txt
    timeout-minutes: 20

  check_unused_cassettes:
    name: Check unused cassettes
    needs: [bundler, system_rubygems_bundler]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 3.4.9
          bundler: none
      - name: Prepare dependencies
        run: bin/rake setup
      - name: Download all used cassettes as artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./spec/support/artifice/used_vcr_cassettes
      - name: Check unused cassettes
        run: bin/rake spec:realworld:check_unused_cassettes

  all-pass:
    name: All realworld-bundler jobs pass

    if: always()

    needs:
      - bundler
      - tapioca
      - system_rubygems_bundler
      - check_unused_cassettes

    runs-on: ubuntu-latest

    steps:
      - name: check dependent jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
